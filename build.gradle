import net.ornithemc.keratin.api.TaskSelection

plugins {
	id 'java'
	id 'maven-publish'
	id 'keratin' version '41.2'
}

repositories {
	// Mojang's library server - prioritize for launchwrapper
	exclusiveContent {
		forRepository {
			maven {
				name = 'Mojang'
				url = 'https://libraries.minecraft.net/'
			}
		}
		filter {
			includeGroup 'net.minecraft'
		}
	}

	mavenCentral()
	maven {
		name = 'Ornithe Releases'
		url = 'https://maven.ornithemc.net/releases'
	}
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
}

def ENV = System.getenv()

// Use minecraft_version from gradle.properties
def minecraft_version = project.minecraft_version

// Match biny-mappings build number pattern
def build_number = project.hasProperty("build_id") ? project.build_id : "local"
def mappingVersion = "${minecraft_version}+build.${build_number}"
version = mappingVersion

// Nests versions from gradle.properties
def nestsVersion = project.nests_build
def clientNestsVersion = "${minecraft_version}-client+build.${nestsVersion}"
def serverNestsVersion = "${minecraft_version}-server+build.${nestsVersion}"
def mergedNestsVersion = "${minecraft_version}+build.${nestsVersion}"

// Source nests files
def clientNestsFile = file("nests/${minecraft_version}-client.nest")
def serverNestsFile = file("nests/${minecraft_version}-server.nest")
def mergedNestsFile = file("nests/${minecraft_version}.nest")

// Determine if we're authenticated for remote publish
def isAuthenticated = project.hasProperty("glass_maven_url")

// Local temp maven directory for non-authenticated builds
def tempMavenDir = file("${projectDir}/temp")

// Nests repository URL - use remote if authenticated, local temp otherwise
def nestsRepositoryUrl = isAuthenticated
	? 'https://maven.glass-launcher.net/releases/'
	: "file://${tempMavenDir.absolutePath}/"

keratin {
	minecraftVersion minecraft_version
	intermediaryGen = 2

	tasks TaskSelection.MAPPINGS

	// Use custom biny-nests instead of default ornithe nests
	// This is necessary because biny has some classes standalone that ornithe/feather nests
	mavenSourcedNestsArtifacts {
		repositoryUrl = nestsRepositoryUrl
		groupId = 'net.glasslauncher'
		artifactId = 'biny-nests'
	}
}

// Create client nests JAR
tasks.register('clientNestsJar', Jar) {
	archiveBaseName = 'biny-nests'
	archiveVersion = clientNestsVersion
	archiveClassifier = ''

	from(clientNestsFile) {
		into 'nests'
		rename { 'mappings.nest' }
	}

	onlyIf { clientNestsFile.exists() }
}

// Create server nests JAR
tasks.register('serverNestsJar', Jar) {
	archiveBaseName = 'biny-nests'
	archiveVersion = serverNestsVersion
	archiveClassifier = ''

	from(serverNestsFile) {
		into 'nests'
		rename { 'mappings.nest' }
	}

	onlyIf { serverNestsFile.exists() }
}

// Create merged nests JAR
tasks.register('mergedNestsJar', Jar) {
	archiveBaseName = 'biny-nests'
	archiveVersion = mergedNestsVersion
	archiveClassifier = ''

	from(mergedNestsFile) {
		into 'nests'
		rename { 'mappings.nest' }
	}

	onlyIf { mergedNestsFile.exists() }
}

// Helper to check if a version exists on maven
def versionExists(String artifactId, String version) {
	try {
		def url = "https://maven.glass-launcher.net/releases/net/glasslauncher/${artifactId}/maven-metadata.xml"
		def xml = new URL(url).text
		def metadata = new XmlSlurper().parseText(xml)
		def versions = metadata.versioning.versions.version*.text()
		return versions.contains(version)
	} catch (Exception e) {
		// If we can't check (e.g., artifact doesn't exist yet), assume it doesn't exist
		return false
	}
}

publishing {
	publications {
		maven(MavenPublication) {
			groupId = 'net.glasslauncher'
			artifactId = 'biny-ornithe'
			version = mappingVersion

			// Main jar (tiny v1 merged) - matches biny's tinyJar
			artifact(tasks.named("${minecraft_version}_mergedTinyV1Jar")) {
				classifier = ''
			}
			// Tiny v2 unmerged - matches biny's v2UnmergedYarnJar
			artifact(tasks.named("${minecraft_version}_tinyV2Jar")) {
				classifier = 'v2'
			}
			// Tiny v2 merged - matches biny's v2MergedYarnJar
			artifact(tasks.named("${minecraft_version}_mergedTinyV2Jar")) {
				classifier = 'mergedv2'
			}
		}

		clientNests(MavenPublication) {
			groupId = 'net.glasslauncher'
			artifactId = 'biny-nests'
			version = clientNestsVersion
			artifact(tasks.clientNestsJar)
		}

		serverNests(MavenPublication) {
			groupId = 'net.glasslauncher'
			artifactId = 'biny-nests'
			version = serverNestsVersion
			artifact(tasks.serverNestsJar)
		}

		mergedNests(MavenPublication) {
			groupId = 'net.glasslauncher'
			artifactId = 'biny-nests'
			version = mergedNestsVersion
			artifact(tasks.mergedNestsJar)
		}
	}
	repositories {
		// Local temp maven for local builds
		maven {
			name = 'TempLocal'
			url = tempMavenDir
		}
		// Standard local maven
		mavenLocal()
		// Remote glass-launcher maven (if authenticated)
		if (isAuthenticated) {
			maven {
				name = 'GlassLauncher'
				url = project.glass_maven_url
				credentials {
					username project.glass_maven_username
					password project.glass_maven_password
				}
			}
		}
	}
}

// Task to publish nests to temp local maven and generate maven-metadata.xml
task publishNestsToTempLocal {
	dependsOn 'publishClientNestsPublicationToTempLocalRepository'
	dependsOn 'publishServerNestsPublicationToTempLocalRepository'
	dependsOn 'publishMergedNestsPublicationToTempLocalRepository'

	doLast {
		// Generate maven-metadata.xml for keratin to find the nests
		def nestsDir = file("${tempMavenDir}/net/glasslauncher/biny-nests")
		nestsDir.mkdirs()

		def metadataFile = file("${nestsDir}/maven-metadata.xml")
		metadataFile.text = """<?xml version="1.0" encoding="UTF-8"?>
<metadata>
  <groupId>net.glasslauncher</groupId>
  <artifactId>biny-nests</artifactId>
  <versioning>
    <latest>${mergedNestsVersion}</latest>
    <release>${mergedNestsVersion}</release>
    <versions>
      <version>${clientNestsVersion}</version>
      <version>${serverNestsVersion}</version>
      <version>${mergedNestsVersion}</version>
    </versions>
    <lastUpdated>${new Date().format('yyyyMMddHHmmss')}</lastUpdated>
  </versioning>
</metadata>
"""
		println ""
		println "Published nests to temp local maven: ${tempMavenDir}"
		println "  net.glasslauncher:biny-nests:${clientNestsVersion}"
		println "  net.glasslauncher:biny-nests:${serverNestsVersion}"
		println "  net.glasslauncher:biny-nests:${mergedNestsVersion}"
	}
}

// A task to ensure that the version being released has not already been released.
task checkVersion {
	doFirst {
		def xml = new URL("https://maven.glass-launcher.net/releases/net/glasslauncher/biny-ornithe/maven-metadata.xml").text
		def metadata = new XmlSlurper().parseText(xml)
		def versions = metadata.versioning.versions.version*.text();
		if (versions.contains(version)) {
			throw new RuntimeException("${version} has already been released!")
		}
	}
}

publish.mustRunAfter checkVersion

// Configure nests publication tasks to skip if version already exists on remote (no error)
tasks.matching { it.name.startsWith('publishClientNestsPublicationToGlassLauncherRepository') }.configureEach {
	onlyIf {
		def exists = versionExists('biny-nests', clientNestsVersion)
		if (exists) {
			println "Skipping client nests publish: ${clientNestsVersion} already exists"
		}
		return !exists && clientNestsFile.exists()
	}
}

tasks.matching { it.name.startsWith('publishServerNestsPublicationToGlassLauncherRepository') }.configureEach {
	onlyIf {
		def exists = versionExists('biny-nests', serverNestsVersion)
		if (exists) {
			println "Skipping server nests publish: ${serverNestsVersion} already exists"
		}
		return !exists && serverNestsFile.exists()
	}
}

tasks.matching { it.name.startsWith('publishMergedNestsPublicationToGlassLauncherRepository') }.configureEach {
	onlyIf {
		def exists = versionExists('biny-nests', mergedNestsVersion)
		if (exists) {
			println "Skipping merged nests publish: ${mergedNestsVersion} already exists"
		}
		return !exists && mergedNestsFile.exists()
	}
}

// Task to publish nests to remote glass-launcher maven
task publishNestsToRemote {
	dependsOn 'publishClientNestsPublicationToGlassLauncherRepository'
	dependsOn 'publishServerNestsPublicationToGlassLauncherRepository'
	dependsOn 'publishMergedNestsPublicationToGlassLauncherRepository'

	doLast {
		println ""
		println "Published nests to glass-launcher maven:"
		println "  net.glasslauncher:biny-nests:${clientNestsVersion}"
		println "  net.glasslauncher:biny-nests:${serverNestsVersion}"
		println "  net.glasslauncher:biny-nests:${mergedNestsVersion}"
	}
}

// Task to publish nests to local maven
task publishNestsToMavenLocal {
	dependsOn 'publishClientNestsPublicationToMavenLocal'
	dependsOn 'publishServerNestsPublicationToMavenLocal'
	dependsOn 'publishMergedNestsPublicationToMavenLocal'

	doLast {
		println ""
		println "Published nests to local Maven:"
		println "  net.glasslauncher:biny-nests:${clientNestsVersion}"
		println "  net.glasslauncher:biny-nests:${serverNestsVersion}"
		println "  net.glasslauncher:biny-nests:${mergedNestsVersion}"
	}
}

// Ensure nests are published before mappings can be built/published
// downloadNests task needs the nests to exist in the repository first
tasks.matching { it.name == 'downloadNests' }.configureEach {
	if (!isAuthenticated) {
		dependsOn publishNestsToTempLocal
	}
}

// For remote publish, ensure nests are published before mappings
tasks.matching { it.name == 'publishMavenPublicationToGlassLauncherRepository' }.configureEach {
	mustRunAfter publishNestsToRemote
}

// For local maven publish, ensure nests are published before mappings
tasks.matching { it.name == 'publishMavenPublicationToMavenLocal' }.configureEach {
	mustRunAfter publishNestsToMavenLocal
}
